<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 245" role="img" aria-label="Chromosome translocation creates BCR-ABL and a kinase inhibitor blocks it"><rect width="720" height="245" rx="12" fill="#f8faf8"/><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="24" y="64" width="130" height="82" rx="12" fill="#d6e5dd" stroke="#80aa91"/><text x="89" y="99" font-size="20" font-weight="bold" fill="#244b38">BCR</text><text x="89" y="122" font-size="13" fill="#536b5d">Chromosome 22</text><rect x="174" y="64" width="130" height="82" rx="12" fill="#e8dfd5" stroke="#ba9e87"/><text x="239" y="99" font-size="20" font-weight="bold" fill="#6b4c37">ABL</text><text x="239" y="122" font-size="13" fill="#6b5e50">Chromosome 9</text><rect x="361" y="64" width="145" height="82" rx="12" fill="#f6e8df" stroke="#ca9781"/><text x="433" y="99" font-size="20" font-weight="bold" fill="#764e3c">BCR-ABL</text><text x="433" y="122" font-size="13" fill="#765e52">Hyperactive kinase</text><rect x="557" y="64" width="137" height="82" rx="12" fill="#d6e5dd" stroke="#80aa91"/><text x="625" y="96" font-size="18" font-weight="bold" fill="#244b38">Imatinib</text><text x="625" y="120" font-size="13" fill="#536b5d">Blocks activity</text><text x="360" y="197" font-size="13" fill="#65756b">Simplified CML mechanism: fusion gene → kinase → targeted inhibitor</text></g><g fill="none" stroke="#879a8f" stroke-width="2.5"><path d="M307 104h48m-10 -8l10 8 -10 8M509 104h42m-10 -8l10 8 -10 8"/></g></svg>