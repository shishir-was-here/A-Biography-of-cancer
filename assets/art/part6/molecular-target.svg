<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 215" role="img" aria-label="From cancer gene to specific medicine"><rect width="720" height="215" rx="12" fill="#f8faf8"/><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="25" y="54" width="194" height="104" rx="12" fill="white" stroke="#bec8c3"/><text x="122" y="88" font-size="18" fill="#25352d" font-weight="bold">Altered gene</text><text x="122" y="114" font-size="13" fill="#596e60">Cancer-specific</text><text x="122" y="134" font-size="13" fill="#596e60">growth signal</text><rect x="263" y="54" width="194" height="104" rx="12" fill="white" stroke="#bec8c3"/><text x="360" y="88" font-size="18" fill="#25352d" font-weight="bold">Molecular target</text><text x="360" y="114" font-size="13" fill="#596e60">Protein or signaling</text><text x="360" y="134" font-size="13" fill="#596e60">pathway</text><rect x="501" y="54" width="194" height="104" rx="12" fill="white" stroke="#bec8c3"/><text x="598" y="88" font-size="18" fill="#25352d" font-weight="bold">Specific medicine</text><text x="598" y="114" font-size="13" fill="#596e60">Inhibit the abnormal</text><text x="598" y="134" font-size="13" fill="#596e60">dependency</text></g><g fill="none" stroke="#739582" stroke-width="3"><path d="M222 106H258m-12 -8l12 8 -12 8M460 106h38m-12 -8l12 8 -12 8"/></g><text x="360" y="191" font-family="Arial,sans-serif" text-anchor="middle" font-size="12" fill="#65756b">A conceptual research strategy, not a guarantee that every target will yield a useful drug</text></svg>