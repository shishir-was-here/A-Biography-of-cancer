<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="Different driver mutations may converge on shared pathways"><rect width="720" height="260" rx="12" fill="#f8faf8"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="360" y="30" font-size="18" fill="#31443a" font-weight="bold">Different genes, shared biological pathways</text><rect x="40" y="70" width="145" height="63" rx="10" fill="white" stroke="#a8c1b0"/><rect x="215" y="70" width="145" height="63" rx="10" fill="white" stroke="#a8c1b0"/><rect x="390" y="70" width="145" height="63" rx="10" fill="white" stroke="#a8c1b0"/><text x="112" y="108" font-size="16" fill="#3b5d4b">Gene A</text><text x="287" y="108" font-size="16" fill="#3b5d4b">Gene B</text><text x="462" y="108" font-size="16" fill="#3b5d4b">Gene C</text><rect x="217" y="183" width="285" height="48" rx="10" fill="#d9e9df" stroke="#81aa90"/><text x="360" y="213" font-size="16" font-weight="bold" fill="#294d38">Shared growth / survival pathway</text></g><g stroke="#789781" stroke-width="2.5" fill="none"><path d="M112 135L280 181M287 135L350 181M462 135L438 181"/></g><g font-family="Arial,sans-serif" fill="#7b817a" font-size="13"><text x="551" y="92">Many passenger</text><text x="551" y="111">mutations also exist,</text><text x="551" y="130">but may not drive</text><text x="551" y="149">tumor behavior.</text></g></svg>