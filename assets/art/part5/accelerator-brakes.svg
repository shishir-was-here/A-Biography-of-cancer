<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="The cancer gene accelerator and tumor suppressor brake analogy"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#27312e}.head{font-size:18px;font-weight:700}.sub{font-size:12px;fill:#56645d}.stroke{stroke:#72897c;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.panel{fill:#f4f7f4;stroke:#a8beb2;stroke-width:1.4}</style>
<rect width="720" height="260" rx="16" fill="#fffdfa"/><text x="360" y="31" class="head" text-anchor="middle">Two kinds of broken growth control</text>
<rect x="28" y="64" width="317" height="144" rx="12" class="panel"/><rect x="375" y="64" width="317" height="144" rx="12" class="panel"/>
<text x="186" y="94" class="head" text-anchor="middle">Oncogene</text><text x="186" y="119" class="sub" text-anchor="middle">Accelerator stuck ON</text><circle cx="186" cy="154" r="25" stroke="#ae6652" fill="#f6ded5" stroke-width="4"/><path d="M186 154 L202 138" stroke="#ae6652" stroke-width="5" stroke-linecap="round"/>
<text x="533" y="94" class="head" text-anchor="middle">Tumor suppressor</text><text x="533" y="119" class="sub" text-anchor="middle">Brake no longer works</text><rect x="512" y="138" width="43" height="36" rx="5" fill="#cbded3" stroke="#618674" stroke-width="2"/><path d="M503 185 L563 128" stroke="#b16f60" stroke-width="4" stroke-linecap="round"/>
<text x="360" y="237" class="sub" text-anchor="middle">Either failure can disrupt normal control; cancers often accumulate several changes.</text></svg>