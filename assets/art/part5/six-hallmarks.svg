<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-label="Six original hallmarks of cancer in the 2000 framework"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#27312e}.head{font-size:17px;font-weight:700}.sub{font-size:12px;fill:#53655a}.panel{fill:#f4f7f4;stroke:#afc4b8;stroke-width:1.5}</style><rect width="720" height="450" rx="16" fill="#fffdfa"/><text x="360" y="33" class="head" text-anchor="middle">Six hallmarks of cancer</text><text x="360" y="54" class="sub" text-anchor="middle">Historical framework published by Hanahan &amp; Weinberg in 2000</text><rect class="panel" x="27" y="81" width="316" height="91" rx="10"/><circle cx="50" cy="107" r="13" fill="#dae8df"/><text x="50" y="112" font-size="14" text-anchor="middle" font-weight="700">1</text><text x="73" y="113" class="head">Independent growth</text><text x="73" y="138" class="sub">Growth signals stay active</text><rect class="panel" x="377" y="81" width="316" height="91" rx="10"/><circle cx="400" cy="107" r="13" fill="#dae8df"/><text x="400" y="112" font-size="14" text-anchor="middle" font-weight="700">2</text><text x="423" y="113" class="head">Ignoring stop signals</text><text x="423" y="138" class="sub">Normal restraints are bypassed</text><rect class="panel" x="27" y="197" width="316" height="91" rx="10"/><circle cx="50" cy="223" r="13" fill="#dae8df"/><text x="50" y="228" font-size="14" text-anchor="middle" font-weight="700">3</text><text x="73" y="229" class="head">Avoiding cell death</text><text x="73" y="254" class="sub">Damage fails to trigger removal</text><rect class="panel" x="377" y="197" width="316" height="91" rx="10"/><circle cx="400" cy="223" r="13" fill="#dae8df"/><text x="400" y="228" font-size="14" text-anchor="middle" font-weight="700">4</text><text x="423" y="229" class="head">Repeated division</text><text x="423" y="254" class="sub">Cells keep replicating</text><rect class="panel" x="27" y="313" width="316" height="91" rx="10"/><circle cx="50" cy="339" r="13" fill="#dae8df"/><text x="50" y="344" font-size="14" text-anchor="middle" font-weight="700">5</text><text x="73" y="345" class="head">New blood vessels</text><text x="73" y="370" class="sub">Tumors recruit nourishment</text><rect class="panel" x="377" y="313" width="316" height="91" rx="10"/><circle cx="400" cy="339" r="13" fill="#dae8df"/><text x="400" y="344" font-size="14" text-anchor="middle" font-weight="700">6</text><text x="423" y="345" class="head">Invasion and spread</text><text x="423" y="370" class="sub">Cancer enters new tissues</text><text x="360" y="434" class="sub" text-anchor="middle">Later research broadened this framework; this figure follows the book’s historical account.</text></svg>